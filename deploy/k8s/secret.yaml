# Create the secret before deploying:
#   kubectl create secret generic greenthreads-secrets \
#     --from-literal=auth-token=$(openssl rand -hex 32)
# This file is a reminder — do not store actual secret values in git.
apiVersion: v1
kind: Secret
metadata:
  name: greenthreads-secrets
type: Opaque
data:
  # auth-token: base64-encoded value (set via kubectl, not here)
  auth-token: ""
