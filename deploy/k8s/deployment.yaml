apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenthreads
  labels:
    app: greenthreads
spec:
  # Runtime state is in-memory and per-pod, so this is not a horizontally-shared
  # service; 2 replicas give availability during rolling updates / node drains
  # (see the PodDisruptionBudget). Each replica is independent.
  replicas: 2
  selector:
    matchLabels:
      app: greenthreads
  template:
    metadata:
      labels:
        app: greenthreads
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # No Kubernetes API access is needed; drop the token to shrink the
      # attack surface.
      automountServiceAccountToken: false
      securityContext:
        # Complete the Restricted Pod Security Standard baseline.
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: greenthreads
        # Published by the release workflow. Pin to an immutable digest in
        # production (e.g. ghcr.io/sanskarpan/greenthreads@sha256:...).
        image: ghcr.io/sanskarpan/greenthreads:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: GREENTHREADS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: greenthreads-secrets
              key: auth-token
        - name: LOG_LEVEL
          value: "INFO"
        - name: GREENTHREADS_MAX_CLIENTS
          value: "64"
        - name: GREENTHREADS_MAX_FIBERS
          value: "1000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            # PERF-11: At 64KB/fiber and 1000 max fibers: 64MB stack + 256MB base = 320MB.
            # Adjust GREENTHREADS_MAX_FIBERS if increasing this limit.
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
