site_name: greenthreads — Go fiber scheduler
site_description: >-
  User-level fiber scheduler for Go: four scheduling algorithms, fiber-aware
  sync primitives, deadlock detection, Prometheus metrics, and a live WebSocket
  control plane — all in one statically linked binary.
site_author: sanskarpan
repo_url: https://github.com/sanskarpan/User-Level-Threading-Library
repo_name: sanskarpan/greenthreads
edit_uri: edit/main/docs/

docs_dir: docs

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

plugins:
  - search

nav:
  - Home: index.md
  - Schedulers: schedulers.md
  - Sync Primitives: sync.md
  - API Reference: api.md
  - Configuration: configuration.md
  - Observability: observability.md
  - Deployment: deployment.md
  - FAQ: faq.md
  - Comparison: comparison.md
  - Architecture: ARCHITECTURE.md
  - Contributing: CONTRIBUTING.md
  - Design:
      - ADR-0001 Execution model: adr/0001-execution-model.md
      - ADR-0002 Control-plane boundary: adr/0002-control-plane-boundary.md
      - ADR-0003 Embedded assets: adr/0003-embedded-assets.md
