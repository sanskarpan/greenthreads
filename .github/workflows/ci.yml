name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build -trimpath ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Action pin policy
        run: bash scripts/check_action_pins.sh
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
      - name: Coverage gate
        run: make coverage COVERAGE_MIN=45
      - name: Benchmark regression gate
        run: bash scripts/check_benchmarks.sh
      - name: Fuzz smoke (bounded)
        run: |
          go test -run=^$$ -fuzz=FuzzStackPopNeverPanics -fuzztime=15s ./internal/fiber
          go test -run=^$$ -fuzz=FuzzPayloadIntNeverPanics -fuzztime=15s ./web
          go test -run=^$$ -fuzz=FuzzPayloadStringNeverPanics -fuzztime=15s ./web
      - name: Dependency vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.26.5
          go-package: ./...
      - name: SAST
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: ./...

  container:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag greenthreads:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: greenthreads:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
