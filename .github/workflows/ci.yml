name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build -trimpath ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Action pin policy
        run: bash scripts/check_action_pins.sh
      - name: Lint
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86 # v6.1.0
        with:
          version: v1.64
      - name: Coverage gate
        run: make coverage COVERAGE_MIN=80
      - name: Benchmark regression gate
        run: bash scripts/check_benchmarks.sh
      - name: Fuzz smoke (bounded)
        run: |
          go test -run=^$$ -fuzz=FuzzStackPopNeverPanics -fuzztime=15s ./internal/fiber
          go test -run=^$$ -fuzz=FuzzPayloadIntNeverPanics -fuzztime=15s ./web
          go test -run=^$$ -fuzz=FuzzPayloadStringNeverPanics -fuzztime=15s ./web
      - name: Dependency vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.26.5
          go-package: ./...
      - name: SAST
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: ./...

  container:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build --tag greenthreads:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: greenthreads:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
