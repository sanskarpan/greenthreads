name: Tag Main

on:
  push:
    branches: [main]
    # Only trigger auto-release when a commit message starts with "release:"
    # to prevent every merge from creating a tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      - name: Build server
        run: go build -o /tmp/greenthreads-server ./cmd/server
      - name: Start server
        run: |
          GREENTHREADS_AUTH_TOKEN=test-integration-token /tmp/greenthreads-server -listen 0.0.0.0:8080 &
          echo $! > /tmp/server.pid
      - name: Integration smoke test
        run: |
          # Wait up to 15 seconds for server to accept connections
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Server failed to become ready"
              exit 1
            fi
            sleep 1
          done
          # Verify /healthz returns 200
          curl -sf http://localhost:8080/healthz || exit 1
          # Verify /metrics returns 200
          curl -sf -H "Authorization: Bearer test-integration-token" http://localhost:8080/metrics || exit 1
          echo "Integration test passed"
      - name: Stop server
        run: pkill greenthreads-server || true

  tag:
    needs: [integration-test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.create_tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Create patch tag
        id: create_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Annotated tags require a committer identity, which the runner does
          # not set by default.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            next="${{ github.event.inputs.version }}"
          else
            latest="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
            if [[ -z "$latest" ]]; then
              next="v0.1.0"
            else
              version="${latest#v}"
              IFS=. read -r major minor patch <<< "$version"
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          git tag -a "$next" -m "Release $next" "$GITHUB_SHA"
          git push origin "$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  # Cross-compiled binaries + checksums + SBOM, published to the GitHub release
  # by goreleaser (which creates the release for the tag).
  binaries:
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check out the release tag
        run: git checkout "${{ needs.tag.outputs.version }}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      - name: Generate SBOM
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          format: spdx-json
          output-file: greenthreads-sbom.spdx.json
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Build, push, and keyless-sign the container image so the deploy path
  # (deploy/k8s, `docker pull`) actually resolves an image. Runs after the tag
  # exists so the image is tagged with the release version.
  container:
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Keyless-sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
